<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Testing Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #60dac5 0%, #cdcbcf 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #60dac5 0%, #cdcbcf 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }
        .section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }
        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            background: linear-gradient(135deg, #60dac5 0%, #cdcbcf 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #60dac5 0%, #cdcbcf 100%);
        }
        button:active {
            transform: translateY(0);
        }
        .response {
            grid-column: 1 / -1;
            background: #212529;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .response h3 {
            color: #ffc107;
            margin-bottom: 10px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .small-input {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .success { color: #28a745 !important; }
        .error { color: #dc3545 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>API Testing Interface</h1>
            <p>Test Product API Endpoints</p>
        </div>
        
        <div class="content">
            <!-- GET All Products -->
            <div class="section">
                <h2>GET All Products</h2>
                <div class="form-group">
                    <label>Title (tìm kiếm):</label>
                    <input type="text" id="searchTitle" placeholder="VD: Hoodie">
                </div>
                <div class="small-input">
                    <div class="form-group">
                        <label>Min Price:</label>
                        <input type="number" id="minPrice" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Max Price:</label>
                        <input type="number" id="maxPrice" placeholder="1000000">
                    </div>
                </div>
                <div class="small-input">
                    <div class="form-group">
                        <label>Page:</label>
                        <input type="number" id="page" value="1" title="Page number" placeholder="1">
                    </div>
                    <div class="form-group">
                        <label>Limit:</label>
                        <input type="number" id="limit" value="10" title="Items per page" placeholder="10">
                    </div>
                </div>
                <button onclick="getAllProducts()">🔍 Lấy danh sách</button>
            </div>

            <!-- GET by ID -->
            <div class="section">
                <h2>GET by ID</h2>
                <div class="form-group">
                    <label>Product ID:</label>
                    <input type="text" id="getById" placeholder="VD: 1">
                </div>
                <button onclick="getProductById()">Tìm theo ID</button>
            </div>

            <!-- GET by Slug -->
            <div class="section">
                <h2>GET by Slug</h2>
                <div class="form-group">
                    <label>Product Slug:</label>
                    <input type="text" id="getBySlug" placeholder="VD: dien-thoai-samsung">
                </div>
                <button onclick="getProductBySlug()">Tìm theo Slug</button>
            </div>

            <!-- POST Create Product -->
            <div class="section">
                <h2>POST Create Product</h2>
                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" id="postTitle" placeholder="VD: Điện thoại Samsung Galaxy">
                </div>
                <div class="form-group">
                    <label>Price:</label>
                    <input type="number" id="postPrice" placeholder="VD: 15000000">
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="postDescription" placeholder="Mô tả sản phẩm..."></textarea>
                </div>
                <button onclick="createProduct()">Tạo sản phẩm mới</button>
            </div>

            <!-- PUT Update Product -->
            <div class="section">
                <h2>PUT Update Product</h2>
                <div class="form-group">
                    <label>Product ID:</label>
                    <input type="text" id="updateId" placeholder="VD: 1">
                </div>
                <div class="form-group">
                    <label>New Price:</label>
                    <input type="number" id="updatePrice" placeholder="Giá mới">
                </div>
                <div class="form-group">
                    <label>New Description:</label>
                    <textarea id="updateDescription" placeholder="Mô tả mới..."></textarea>
                </div>
                <button onclick="updateProduct()">Cập nhật</button>
            </div>

            <!-- DELETE Product -->
            <div class="section">
                <h2>DELETE Product</h2>
                <div class="form-group">
                    <label>Product ID:</label>
                    <input type="text" id="deleteId" placeholder="VD: 1">
                </div>
                <button onclick="deleteProduct()">Xóa sản phẩm</button>
            </div>

            <!-- Test Validation -->
            <div class="section">
                <h2>Test Validation</h2>
                <div class="btn-group">
                    <button onclick="testValidation('emptyTitle')">Title trống</button>
                    <button onclick="testValidation('invalidPrice')">Price không hợp lệ</button>
                    <button onclick="testValidation('invalidPage')">Page không hợp lệ</button>
                    <button onclick="testValidation('maxMinPrice')">Max < Min Price</button>
                </div>
            </div>

            <!-- Response -->
            <div class="response">
                <h3>Response:</h3>
                <div id="response">Chưa có request nào được gửi...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/products';

        function showResponse(data, isError = false) {
            const responseDiv = document.getElementById('response');
            responseDiv.className = isError ? 'error' : 'success';
            responseDiv.textContent = JSON.stringify(data, null, 2);
        }

        async function getAllProducts() {
            const title = document.getElementById('searchTitle').value;
            const minPrice = document.getElementById('minPrice').value;
            const maxPrice = document.getElementById('maxPrice').value;
            const page = document.getElementById('page').value;
            const limit = document.getElementById('limit').value;

            let url = API_URL + '?';
            if (title) url += `title=${encodeURIComponent(title)}&`;
            if (minPrice) url += `minPrice=${minPrice}&`;
            if (maxPrice) url += `maxPrice=${maxPrice}&`;
            if (page) url += `page=${page}&`;
            if (limit) url += `limit=${limit}&`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                showResponse({ status: response.status, data }, !response.ok);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        async function getProductById() {
            const id = document.getElementById('getById').value;
            if (!id) {
                showResponse({ error: 'Vui lòng nhập ID' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`);
                const data = await response.json();
                showResponse({ status: response.status, data }, !response.ok);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        async function getProductBySlug() {
            const slug = document.getElementById('getBySlug').value;
            if (!slug) {
                showResponse({ error: 'Vui lòng nhập slug' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/slug/${slug}`);
                const data = await response.json();
                showResponse({ status: response.status, data }, !response.ok);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        async function createProduct() {
            const title = document.getElementById('postTitle').value;
            const price = document.getElementById('postPrice').value;
            const description = document.getElementById('postDescription').value;

            const body = {
                title,
                price: parseFloat(price),
                description,
                category: { id: 1, name: 'Test Category' },
                images: ['https://via.placeholder.com/300']
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();
                showResponse({ status: response.status, data }, !response.ok);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        async function updateProduct() {
            const id = document.getElementById('updateId').value;
            const price = document.getElementById('updatePrice').value;
            const description = document.getElementById('updateDescription').value;

            if (!id) {
                showResponse({ error: 'Vui lòng nhập ID' }, true);
                return;
            }

            const body = {};
            if (price) body.price = parseFloat(price);
            if (description) body.description = description;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();
                showResponse({ status: response.status, data }, !response.ok);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        async function deleteProduct() {
            const id = document.getElementById('deleteId').value;
            if (!id) {
                showResponse({ error: 'Vui lòng nhập ID' }, true);
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                showResponse({ status: response.status, data }, !response.ok);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        async function testValidation(type) {
            let url, options;

            switch(type) {
                case 'emptyTitle':
                    url = API_URL;
                    options = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: '', price: 100, description: 'Test' })
                    };
                    break;
                case 'invalidPrice':
                    url = API_URL;
                    options = {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: 'Test', price: 'abc', description: 'Test' })
                    };
                    break;
                case 'invalidPage':
                    url = `${API_URL}?page=abc`;
                    options = { method: 'GET' };
                    break;
                case 'maxMinPrice':
                    url = `${API_URL}?minPrice=100&maxPrice=50`;
                    options = { method: 'GET' };
                    break;
            }

            try {
                const response = await fetch(url, options);
                const data = await response.json();
                showResponse({ status: response.status, data }, !response.ok);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }
    </script>
</body>
</html>
